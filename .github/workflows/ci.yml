name: RaceDay CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build API project
      run: dotnet build RaceDay.API/RaceDay.API.csproj --configuration Release --no-restore

    - name: Build MVC project
      run: dotnet build RaceDay.MVC/RaceDay.MVC.csproj --configuration Release --no-restore

    - name: Run unit tests
      run: dotnet test RaceDay.Tests/RaceDay.Tests.csproj --configuration Release --no-restore --verbosity normal

    - name: Build Docker image
      run: docker build -t raceday-app .
